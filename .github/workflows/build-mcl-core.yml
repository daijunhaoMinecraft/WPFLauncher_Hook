name: Build Mcl.Core

on:
  push:
    branches:
      - main
    paths:
      - "Mcl.Core/**"
      - "tests/Mcl.Core.SmokeTests/**"
      - "scripts/**"
      - ".github/workflows/build-mcl-core.yml"
      - "build/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mcl-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_UI_LANGUAGE: en

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private build dependencies
        uses: actions/checkout@v4
        with:
          repository: daijunhaoMinecraft/WPFLauncher_Hook_Build
          ref: main
          path: .private-build
          ssh-key: ${{ secrets.WPFLAUNCHER_HOOK_BUILD_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify private dependency bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE ".private-build"))
          $prefix = $root.TrimEnd("\") + "\"
          $manifest = Join-Path $root "SHA256SUMS.txt"
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
              throw "Missing dependency manifest: $manifest"
          }

          $count = 0
          Get-Content -LiteralPath $manifest | ForEach-Object {
              if ($_ -notmatch "^([0-9A-Fa-f]{64})  (.+)$") {
                  throw "Invalid dependency manifest line: $_"
              }
              $expected = $Matches[1].ToUpperInvariant()
              $relative = $Matches[2]
              $path = [IO.Path]::GetFullPath((Join-Path $root $relative))
              if (-not $path.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Dependency path escapes the private bundle: $relative"
              }
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Missing dependency: $relative"
              }
              $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              if ($actual -ne $expected) {
                  throw "Dependency hash mismatch: $relative"
              }
              $count++
          }
          if ($count -eq 0) {
              throw "Dependency manifest is empty."
          }
          Write-Host "Verified $count private build dependencies."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Release x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $launcherDirectory = Join-Path $env:GITHUB_WORKSPACE ".private-build\launcher"
          $launcherAssembly = Join-Path $launcherDirectory "WPFLauncher.dump.exe"
          if (-not (Test-Path -LiteralPath $launcherAssembly -PathType Leaf)) {
              throw "Missing launcher assembly: $launcherAssembly"
          }

          $artifacts = Join-Path $env:RUNNER_TEMP "mcl-core-build"
          $output = (Join-Path $artifacts "bin") + [IO.Path]::DirectorySeparatorChar
          $intermediate = (Join-Path $artifacts "obj") + [IO.Path]::DirectorySeparatorChar
          $arguments = @(
              "build", ".\Mcl.Core\Mcl.Core.csproj",
              "--configuration", "Release",
              "--nologo", "-v:minimal",
              "-p:Platform=x86",
              "-p:LauncherDirectory=$launcherDirectory",
              "-p:LauncherAssemblyPath=$launcherAssembly",
              "-p:OutputPath=$output",
              "-p:BaseIntermediateOutputPath=$intermediate"
          )
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "Mcl.Core build failed with exit code $LASTEXITCODE"
          }

          $dll = Join-Path $output "Mcl.Core.dll"
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
              throw "Build output is missing Mcl.Core.dll"
          }

          $destination = Join-Path $env:GITHUB_WORKSPACE "build"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $publicArtifact = Join-Path $destination "Mcl.Core.dll"
          Copy-Item -LiteralPath $dll -Destination $publicArtifact -Force

          $hash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
          $compatibilityDirectory = Join-Path $env:GITHUB_WORKSPACE "Mcl.Core\bin\x86\Debug\net48"
          New-Item -ItemType Directory -Path $compatibilityDirectory -Force | Out-Null
          $compatibilityArtifact = Join-Path $compatibilityDirectory "Mcl.Core.dll"
          Copy-Item -LiteralPath $dll -Destination $compatibilityArtifact -Force
          if ((Get-FileHash -LiteralPath $publicArtifact -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $compatibilityArtifact -Algorithm SHA256).Hash) {
              throw "Copied build artifacts do not match."
          }

          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll)
          Write-Host "Mcl.Core SHA256: $hash"
          Write-Host "Product version: $($version.ProductVersion)"
          @(
              "### Mcl.Core build"
              ""
              "- SHA256: ``$hash``"
              "- File version: ``$($version.FileVersion)``"
              "- Product version: ``$($version.ProductVersion)``"
              "- Public: ``build/Mcl.Core.dll``"
              "- Compatibility: ``Mcl.Core/bin/x86/Debug/net48/Mcl.Core.dll``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Commit build artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- build/Mcl.Core.dll
          git add -f -- Mcl.Core/bin/x86/Debug/net48/Mcl.Core.dll
          if (git diff --cached --quiet) {
              Write-Host "Mcl.Core.dll is unchanged."
              exit 0
          }

          # Keep the artifact commit searchable as the original source change.
          $sourceSha = (git rev-parse HEAD | Out-String).Trim()
          $sourceMessage = (git show -s --format=%B $sourceSha | Out-String).Trim()
          $markerPattern = "(?m)^MCL-SOURCE-COMMIT:\s*([0-9a-f]{40})\s*$"
          $existingMarker = [regex]::Match($sourceMessage, $markerPattern)
          if ($existingMarker.Success) {
              $sourceSha = $existingMarker.Groups[1].Value
              $sourceMessage = $sourceMessage.Substring(0, $existingMarker.Index).TrimEnd()
          }
          else {
              $candidate = $sourceSha
              for ($index = 0; $index -lt 20; $index++) {
                  $candidateMessage = (git show -s --format=%B $candidate | Out-String).Trim()
                  if ($candidateMessage -notmatch "^chore: update Mcl\.Core\.dll(?: \[skip ci\])?$") {
                      $sourceSha = $candidate
                      $sourceMessage = $candidateMessage
                      break
                  }
                  $parent = (git rev-parse "$candidate^" 2>$null | Out-String).Trim()
                  if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($parent)) {
                      break
                  }
                  $candidate = $parent
              }
          }
          if ([string]::IsNullOrWhiteSpace($sourceMessage)) {
              $sourceMessage = "Update Mcl.Core.dll"
          }
          $commitMessage = $sourceMessage.TrimEnd() +
              "`n`nMCL-SOURCE-COMMIT: $sourceSha"
          git commit -m $commitMessage
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
