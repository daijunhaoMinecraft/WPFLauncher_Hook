name: Build Mcl.Core

on:
  push:
    branches:
      - main
    paths:
      - "Mcl.Core/**"
      - "tests/Mcl.Core.SmokeTests/**"
      - "scripts/**"
      - ".github/workflows/build-mcl-core.yml"
      - "build/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mcl-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_UI_LANGUAGE: en

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private build dependencies
        uses: actions/checkout@v4
        with:
          repository: daijunhaoMinecraft/WPFLauncher_Hook_Build
          ref: main
          path: .private-build
          ssh-key: ${{ secrets.WPFLAUNCHER_HOOK_BUILD_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify private dependency bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE ".private-build"))
          $prefix = $root.TrimEnd("\") + "\"
          $manifest = Join-Path $root "SHA256SUMS.txt"
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
              throw "Missing dependency manifest: $manifest"
          }

          $count = 0
          Get-Content -LiteralPath $manifest | ForEach-Object {
              if ($_ -notmatch "^([0-9A-Fa-f]{64})  (.+)$") {
                  throw "Invalid dependency manifest line: $_"
              }
              $expected = $Matches[1].ToUpperInvariant()
              $relative = $Matches[2]
              $path = [IO.Path]::GetFullPath((Join-Path $root $relative))
              if (-not $path.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Dependency path escapes the private bundle: $relative"
              }
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Missing dependency: $relative"
              }
              $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              if ($actual -ne $expected) {
                  throw "Dependency hash mismatch: $relative"
              }
              $count++
          }
          if ($count -eq 0) {
              throw "Dependency manifest is empty."
          }
          Write-Host "Verified $count private build dependencies."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Release x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $launcherDirectory = Join-Path $env:GITHUB_WORKSPACE ".private-build\launcher"
          $launcherAssembly = Join-Path $launcherDirectory "WPFLauncher.dump.exe"
          if (-not (Test-Path -LiteralPath $launcherAssembly -PathType Leaf)) {
              throw "Missing launcher assembly: $launcherAssembly"
          }

          $artifacts = Join-Path $env:RUNNER_TEMP "mcl-core-build"
          $output = (Join-Path $artifacts "bin") + [IO.Path]::DirectorySeparatorChar
          $intermediate = (Join-Path $artifacts "obj") + [IO.Path]::DirectorySeparatorChar
          $arguments = @(
              "build", ".\Mcl.Core\Mcl.Core.csproj",
              "--configuration", "Release",
              "--nologo", "-v:minimal",
              "-p:Platform=x86",
              "-p:LauncherDirectory=$launcherDirectory",
              "-p:LauncherAssemblyPath=$launcherAssembly",
              "-p:OutputPath=$output",
              "-p:BaseIntermediateOutputPath=$intermediate"
          )
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "Mcl.Core build failed with exit code $LASTEXITCODE"
          }

          $dll = Join-Path $output "Mcl.Core.dll"
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
              throw "Build output is missing Mcl.Core.dll"
          }

          $hash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll)
          "MCL_CORE_BUILD_DLL=$dll" | Add-Content -LiteralPath $env:GITHUB_ENV
          "MCL_CORE_BUILD_SHA256=$hash" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Host "Mcl.Core SHA256: $hash"
          Write-Host "Product version: $($version.ProductVersion)"
          @(
              "### Mcl.Core build"
              ""
              "- SHA256: ``$hash``"
              "- File version: ``$($version.FileVersion)``"
              "- Product version: ``$($version.ProductVersion)``"
              "- Branch: ``build-artifacts``"
              "- Artifact: ``build/Mcl.Core.dll``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Publish build artifact branch
        shell: pwsh
        env:
          ARTIFACT_BRANCH: build-artifacts
        run: |
          $ErrorActionPreference = "Stop"

          function Test-MainIsCurrent {
              $line = (git ls-remote origin refs/heads/main | Out-String).Trim()
              if ([string]::IsNullOrWhiteSpace($line)) {
                  return $false
              }
              return (($line -split "\s+")[0] -eq $env:GITHUB_SHA)
          }

          if (-not (Test-MainIsCurrent)) {
              Write-Host "A newer commit is on main; skipping stale artifact publish."
              exit 0
          }

          $sourceSha = $env:GITHUB_SHA
          $sourceMessage = (git show -s --format=%B $sourceSha | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($sourceMessage)) {
              $sourceMessage = "Update Mcl.Core.dll"
          }
          $commitMessage = $sourceMessage.TrimEnd() +
              "`n`nMCL-SOURCE-COMMIT: $sourceSha"

          $artifactWorktree = Join-Path $env:RUNNER_TEMP "mcl-build-artifacts-$env:GITHUB_RUN_ID"
          $refSpec = "refs/heads/$($env:ARTIFACT_BRANCH):refs/remotes/origin/$($env:ARTIFACT_BRANCH)"
          git fetch origin $refSpec
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch $($env:ARTIFACT_BRANCH)."
          }
          git worktree add -B $env:ARTIFACT_BRANCH $artifactWorktree "origin/$($env:ARTIFACT_BRANCH)"
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to create artifact worktree."
          }

          Push-Location $artifactWorktree
          try {
              $destination = Join-Path $artifactWorktree "build"
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
              $artifact = Join-Path $destination "Mcl.Core.dll"
              Copy-Item -LiteralPath $env:MCL_CORE_BUILD_DLL -Destination $artifact -Force
              if ((Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash -ne
                  $env:MCL_CORE_BUILD_SHA256) {
                  throw "Copied artifact hash does not match the build output."
              }

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- build/Mcl.Core.dll
              git diff --cached --quiet
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Mcl.Core.dll is unchanged on $($env:ARTIFACT_BRANCH)."
                  exit 0
              }
              if ($LASTEXITCODE -ne 1) {
                  throw "Unable to inspect staged artifact changes."
              }

              git commit -m $commitMessage
              if ($LASTEXITCODE -ne 0) {
                  throw "Artifact commit failed."
              }

              if (-not (Test-MainIsCurrent)) {
                  Write-Host "Main advanced during the build; discarded stale artifact commit."
                  exit 0
              }

              git push origin "HEAD:refs/heads/$($env:ARTIFACT_BRANCH)"
              if ($LASTEXITCODE -ne 0) {
                  throw "Artifact branch push failed."
              }

              $artifactSha = (git rev-parse HEAD | Out-String).Trim()
              Write-Host "Published $artifactSha to $($env:ARTIFACT_BRANCH)."
              @(
                  ""
                  "- Artifact commit: ``$artifactSha``"
                  "- Source commit: ``$sourceSha``"
              ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          finally {
              Pop-Location
          }
